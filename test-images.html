<!DOCTYPE html>
<html>
<head>
    <title>Image Test</title>
</head>
<body>
    <h1>Testing Image URLs</h1>
    <div id="results"></div>
    
    <script>
        fetch('http://localhost:8000/api/products/')
            .then(response => response.json())
            .then(products => {
                const results = document.getElementById('results');
                
                products.slice(0, 3).forEach((product, index) => {
                    const div = document.createElement('div');
                    div.style.marginBottom = '20px';
                    div.style.border = '1px solid #ccc';
                    div.style.padding = '10px';
                    
                    let html = `<h3>Product ${index + 1}: ${product.name}</h3>`;
                    
                    if (product.images && product.images.length > 0) {
                        const image = product.images.find(img => img.is_primary) || product.images[0];
                        const imageUrl = `http://localhost:8000${image.url}`;
                        html += `<p>Image URL: ${imageUrl}</p>`;
                        html += `<img src="${imageUrl}" style="max-width: 200px; height: auto;" onerror="this.nextSibling.innerHTML='Image failed to load'" />`;
                        html += `<div></div>`;
                    } else {
                        html += '<p>No images</p>';
                    }
                    
                    div.innerHTML = html;
                    results.appendChild(div);
                });
            })
            .catch(error => {
                document.getElementById('results').innerHTML = `<p>Error: ${error.message}</p>`;
            });
    </script>
</body>
</html>
